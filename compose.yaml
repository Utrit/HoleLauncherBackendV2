services:
  api:
    restart: unless-stopped
    image: ${API_IMAGE:-holelauncherbackend-api:local}
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Auth__AccountsUrl: http://access:8080/
      Storage__Url: http://storage:8080/
      Storage__MinUploadBytesPerSecond: ${STORAGE_MIN_UPLOAD_BYTES_PER_SECOND:-500000}
      Auth__SessionKey: ${SESSION_KEY:?Set SESSION_KEY in .env}
      Kafka__BootstrapServers: kafka:9092
      Kafka__Username: api
      Kafka__Password: ${KAFKA_API_PASSWORD:?Set KAFKA_API_PASSWORD in .env}
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8080}:8080"
    networks: [default, accounts_api, kafka_bus, storage_api]
    depends_on:
      init:
        condition: service_completed_successfully
      access:
        condition: service_started

  access:
    restart: unless-stopped
    image: ${ACCESS_IMAGE:-holelauncherbackend-access:local}
    environment:
      Auth__SessionKey: ${SESSION_KEY:?Set SESSION_KEY in .env}
      ConnectionStrings__Accounts: Host=accounts-db;Database=accounts;Username=accounts
      Accounts__Password: ${ACCOUNTS_DB_PASSWORD:?Set ACCOUNTS_DB_PASSWORD in .env}
      Kafka__BootstrapServers: kafka:9092
      Kafka__Username: access
      Kafka__Password: ${KAFKA_ACCESS_PASSWORD:?Set KAFKA_ACCESS_PASSWORD in .env}
    networks: [accounts_api, accounts_db, kafka_bus]
    depends_on:
      init:
        condition: service_completed_successfully

  orchestrator:
    restart: unless-stopped
    image: ${ORCHESTRATOR_IMAGE:-holelauncherbackend-orchestrator:local}
    environment:
      Kafka__BootstrapServers: kafka:9092
      Kafka__Username: orchestrator
      Kafka__Password: ${KAFKA_ORCHESTRATOR_PASSWORD:?Set KAFKA_ORCHESTRATOR_PASSWORD in .env}
      ConnectionStrings__Orchestrator: Host=accounts-db;Database=orchestrator;Username=accounts
      Orchestrator__Password: ${ACCOUNTS_DB_PASSWORD:?Set ACCOUNTS_DB_PASSWORD in .env}
    networks: [kafka_bus, accounts_db]
    depends_on:
      init:
        condition: service_completed_successfully

  init:
    image: postgres:17
    restart: "no"
    entrypoint: ["sh", "/init/run.sh"]
    environment:
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-admin}
      PGHOST: accounts-db
      PGDATABASE: accounts
      PGUSER: accounts
      PGPASSWORD: ${ACCOUNTS_DB_PASSWORD:?Set ACCOUNTS_DB_PASSWORD in .env}
    volumes:
      - ./deploy/init:/init:ro
    networks: [accounts_db]
    depends_on:
      accounts-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  storage:
    restart: unless-stopped
    image: ${STORAGE_IMAGE:-holelauncherbackend-storage:local}
    environment:
      Kafka__BootstrapServers: kafka:9092
      Kafka__Username: storage
      Kafka__Password: ${KAFKA_STORAGE_PASSWORD:?Set KAFKA_STORAGE_PASSWORD in .env}
      Storage__Root: /data/storage
      Storage__MinUploadBytesPerSecond: ${STORAGE_MIN_UPLOAD_BYTES_PER_SECOND:-500000}
    volumes:
      - storage-data:/data/storage
    networks: [storage_api, kafka_bus]
    depends_on:
      init:
        condition: service_completed_successfully

  kafka-init:
    image: apache/kafka:4.1.2
    restart: "no"
    entrypoint: ["sh", "/init/kafka.sh"]
    environment:
      KAFKA_INIT_PASSWORD: ${KAFKA_INIT_PASSWORD:?Set KAFKA_INIT_PASSWORD in .env}
    volumes:
      - ./deploy/init:/init:ro
    networks: [kafka_bus]
    depends_on:
      kafka:
        condition: service_started

  kafka:
    image: apache/kafka:4.1.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_PLAINTEXT,CONTROLLER:SASL_PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: "User:broker;User:init"
      KAFKA_LISTENER_NAME_CONTROLLER_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="broker" password="${KAFKA_BROKER_PASSWORD:?Set KAFKA_BROKER_PASSWORD in .env}"
        user_broker="${KAFKA_BROKER_PASSWORD}";
      KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="broker" password="${KAFKA_BROKER_PASSWORD}"
        user_broker="${KAFKA_BROKER_PASSWORD}"
        user_init="${KAFKA_INIT_PASSWORD}"
        user_api="${KAFKA_API_PASSWORD}"
        user_access="${KAFKA_ACCESS_PASSWORD}"
        user_orchestrator="${KAFKA_ORCHESTRATOR_PASSWORD}"
        user_storage="${KAFKA_STORAGE_PASSWORD}";
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [kafka_bus]

  accounts-db:
    image: postgres:17
    environment:
      POSTGRES_DB: accounts
      POSTGRES_USER: accounts
      POSTGRES_PASSWORD: ${ACCOUNTS_DB_PASSWORD:?Set ACCOUNTS_DB_PASSWORD in .env}
    volumes:
      - accounts-data:/var/lib/postgresql/data
    networks: [accounts_db]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "accounts", "-d", "accounts"]
      interval: 2s
      timeout: 3s
      retries: 20

networks:
  storage_api:
    internal: true
  accounts_api:
    internal: true
  accounts_db:
    internal: true
  kafka_bus:
    internal: true

volumes:
  storage-data:
  accounts-data:
  kafka-data:
