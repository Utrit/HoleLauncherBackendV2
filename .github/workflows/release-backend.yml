name: Publish backend images

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate container tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::The release tag must also be a valid Docker tag."
            exit 1
          fi
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install WebAssembly workload
        run: dotnet workload install wasm-tools
      - name: Publish services and admin UI
        shell: pwsh
        run: ./scripts/publish-local.ps1 -ArtifactDirectory (Join-Path $env:RUNNER_TEMP backend-artifacts)
      - name: Build Docker images
        run: |
          image_prefix="ghcr.io/${GITHUB_REPOSITORY,,}/back"
          for service in api access orchestrator storage repository; do
            docker build --target "$service" \
              --tag "$image_prefix.$service:$GITHUB_REF_NAME" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.version=$GITHUB_REF_NAME" \
              --file Dockerfile "$RUNNER_TEMP/backend-artifacts"
          done
      - name: Push version and latest tags to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image_prefix="ghcr.io/${GITHUB_REPOSITORY,,}/back"
          services=(api access orchestrator storage repository)
          for service in "${services[@]}"; do
            docker push "$image_prefix.$service:$GITHUB_REF_NAME"
          done
          for service in "${services[@]}"; do
            docker tag "$image_prefix.$service:$GITHUB_REF_NAME" "$image_prefix.$service:latest"
            docker push "$image_prefix.$service:latest"
          done

