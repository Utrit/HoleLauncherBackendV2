name: Publish backend images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-images-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Validate container tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::The release tag must also be a valid Docker tag."
            exit 1
          fi
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore WebAssembly workload with .NET 10
        run: |
          dotnet new globaljson --sdk-version 10.0.100 --roll-forward latestFeature --force
          dotnet --version
          dotnet workload restore src/HoleLauncher.Admin/HoleLauncher.Admin.csproj
      - name: Publish services and admin UI
        shell: pwsh
        run: ./scripts/publish-local.ps1 -ArtifactDirectory (Join-Path $env:RUNNER_TEMP backend-artifacts)
      - name: Build Docker images
        run: |
          image_prefix="ghcr.io/${GITHUB_REPOSITORY,,}/back"
          for service in api access orchestrator storage repository launcher; do
            docker build --target "$service" \
              --tag "$image_prefix.$service:$RELEASE_TAG" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
              --label "org.opencontainers.image.version=$RELEASE_TAG" \
              --file Dockerfile "$RUNNER_TEMP/backend-artifacts"
          done
      - name: Push version and latest tags to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image_prefix="ghcr.io/${GITHUB_REPOSITORY,,}/back"
          services=(api access orchestrator storage repository launcher)
          for service in "${services[@]}"; do
            docker push "$image_prefix.$service:$RELEASE_TAG"
          done
          for service in "${services[@]}"; do
            docker tag "$image_prefix.$service:$RELEASE_TAG" "$image_prefix.$service:latest"
            docker push "$image_prefix.$service:latest"
          done

