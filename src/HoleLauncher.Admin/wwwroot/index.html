<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <title data-locale="brand.admin"></title>
  <style>
    html, body, #admin { width: 100%; height: 100%; margin: 0; background: #10141c; }
    #startup {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: grid;
      place-items: center;
      background: #10141c;
      color: #eef2fa;
      font: 16px system-ui;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #343d4d;
      border-top-color: #eef2fa;
      border-radius: 50%;
      animation: spin 800ms linear infinite;
    }
    #login-view { position: fixed; inset: 0; overflow: auto; color: #eef2fa; font: 15px system-ui; }
    #login-view .login-wrap { box-sizing: border-box; max-width: 440px; margin: 60px auto; padding: 0 16px; }
    #login-view form { display: grid; gap: 10px; padding: 24px; background: #1a2230; border-radius: 12px; }
    #login-view input { box-sizing: border-box; width: 100%; min-width: 0; color: inherit; background: #10141c;
                        border: 1px solid #738097; border-radius: 4px; padding: 8px; font: inherit; }
    #login-view input:focus-visible, #login-view button:focus-visible { outline: 2px solid #51aaff; outline-offset: 2px; }
    #login-view button { border: 0; border-radius: 4px; background: #3b4656; color: inherit; padding: 8px 10px; font: inherit; cursor: pointer; }
    #login-view button[type=submit] { background: #086eb8; }
    #login-view .login-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    #login-view .login-password { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; }
    #login-message:empty { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body>
  <div id="admin"></div>
  <section id="login-view" hidden>
    <div class="login-wrap">
      <h1 data-locale="brand.title"></h1>
      <form id="login-form" method="post" action="/api/auth/login/form" autocomplete="on">
        <label for="login-username" data-locale="auth.username"></label>
        <input id="login-username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        <label for="login-password" data-locale="auth.password"></label>
        <div class="login-password">
          <input id="login-password" name="password" type="password" autocomplete="current-password">
          <button id="toggle-password" type="button" data-locale-aria="auth.password_show" aria-pressed="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <div class="login-actions">
          <button type="submit" data-locale="auth.login"></button>
          <button id="register-button" type="button" data-locale="auth.register"></button>
        </div>
        <div id="login-message" role="status"></div>
      </form>
    </div>
  </section>
  <div id="startup" role="status" data-locale-aria="common.loading">
    <div class="spinner" aria-hidden="true"></div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
